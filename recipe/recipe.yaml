schema_version: 1

context:
  # The version branches (6.8.3, 6.9.0, ...) only change these four lines
  version: 6.9.1
  # qtopcua git tag, LTS releases have a suffix, e.g. v6.8.4-lts-lgpl
  tag: v6.9.1
  # open62541 bundled in src/3rdparty/open62541, selects the patch below
  open62541: 1.4.9
  build_number: 0
  mbedtls_version: 3.*

package:
  name: qt6-opcua
  version: ${{ version }}

source:
  git: https://github.com/qt/qtopcua
  tag: ${{ tag }}
  patches:
    # https://github.com/open62541/open62541/pull/8553, 1.3 is not affected
    - if: open62541 is not startingwith "1.3."
      then: patches/open62541-${{ open62541 }}-findservers-without-none-endpoint.patch

build:
  number: ${{ build_number }}
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - qt6-main ${{ version }}.*
        - mbedtls ${{ mbedtls_version }}
    - cmake
    - ninja
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - qt6-main ${{ version }}.*
    - mbedtls ${{ mbedtls_version }}
  run:
    - qt6-main ${{ version }}.*
  run_exports:
    - ${{ pin_subpackage('qt6-opcua', upper_bound='x.x') }}
tests:
  - script:
      - if: win
        then:
          - if not exist %LIBRARY_LIB%\\qt6\\bin\\Qt6OpcUa.dll exit 1
          - if not exist %LIBRARY_BIN%\\Qt6OpcUa.dll exit 1
  # QOpcUaClient::findServers() against a server without a SecurityPolicy#None
  # endpoint, see test/test_qopcuaclient_findservers.cpp
  - script:
      - if: unix
        then:
          - cmake -S test -B test-build
          - cmake --build test-build
          - ctest --test-dir test-build --output-on-failure
        else:
          - cmake -G"NMake Makefiles" -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%" -S test -B test-build
          - cmake --build test-build --config Release
          - ctest --test-dir test-build -C Release --output-on-failure
    requirements:
      run:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake >=3.18
        - openssl
        - if: unix
          then: make
    files:
      recipe:
        - test/CMakeLists.txt
        - test/test_qopcuaclient_findservers.cpp
      source:
        - src/3rdparty/open62541/open62541.c
        - src/3rdparty/open62541/open62541.h

about:
  summary: Qt OPC UA module
  description: |
    The Qt OPC UA module implements a Qt API to interact
    with OPC UA servers on top of the open62541 library.
  license: LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only
  license_file: LICENSES/
  documentation: https://doc.qt.io/qt-6/qtopcua-index.html
  repository: https://github.com/qt/qtopcua
