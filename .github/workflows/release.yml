# Builds the version branch of a published release and uploads the packages to
# prefix.dev. Not generated by conda-smithy: the build steps mirror the
# conda-build.yml it generates, so they use the same .scripts and .ci_support.

name: Release conda package
on:
  release:
    types: [published]

jobs:
  release:
    name: ${{ matrix.CONFIG }}
    environment: prefix-dev
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - CONFIG: linux_64_
            os: ubuntu
            runs_on: ['ubuntu-latest']
            build_workspace_dir: build_artifacts
            tools_install_dir: ~/miniforge3
            subdir: linux-64
          - CONFIG: win_64_
            os: windows
            runs_on: ['windows-2022']
            build_workspace_dir: D:\bld\
            tools_install_dir: D:\Miniforge
            subdir: win-64
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build on Linux
      if: matrix.os == 'ubuntu'
      env:
        CI: github_actions
        CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
        CONFIG: ${{ matrix.CONFIG }}
        MINIFORGE_HOME: ${{ matrix.tools_install_dir }}
        UPLOAD_PACKAGES: 'False'
        IS_PR_BUILD: 'False'
      shell: bash
      # run_docker_build.sh reads DOCKER_IMAGE from .ci_support
      run: |
        export CONDA_BLD_PATH="${CONDA_BLD_PATH/#~/${HOME}}"
        FEEDSTOCK_NAME="$(basename "$GITHUB_REPOSITORY")"
        export FEEDSTOCK_NAME
        export GIT_BRANCH="${GITHUB_REF_NAME}"
        export MINIFORGE_HOME="${MINIFORGE_HOME/#~/${HOME}}"
        export flow_run_id="github_$GITHUB_RUN_ID"
        export remote_url="https://github.com/$GITHUB_REPOSITORY"
        export sha="$GITHUB_SHA"
        ./.scripts/run_docker_build.sh

    - name: Build on Windows
      if: matrix.os == 'windows'
      shell: cmd
      run: |
        set "flow_run_id=github_%GITHUB_RUN_ID%"
        set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
        set "sha=%GITHUB_SHA%"
        call ".scripts\run_win_build.bat"
      env:
        BUILD_PLATFORM: win-64
        CI: github_actions
        CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
        CONFIG: ${{ matrix.CONFIG }}
        MINIFORGE_HOME: ${{ matrix.tools_install_dir }}
        PYTHONUNBUFFERED: 1
        UPLOAD_PACKAGES: 'False'

    # On Windows, run_win_build.bat already installed pixi to ~/.pixi/bin and
    # setup-pixi refuses to overwrite it. The linux build runs in docker.
    - name: Install pixi
      if: matrix.os == 'ubuntu'
      uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        run-install: false

    - name: Upload to prefix.dev
      shell: bash
      env:
        PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        PREFIX_CHANNEL: ${{ secrets.PREFIX_CHANNEL }}
        BLD: ${{ matrix.build_workspace_dir }}
        SUBDIR: ${{ matrix.subdir }}
      run: |
        shopt -s nullglob
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          BLD="$(cygpath -u "${BLD}")"
          export PATH="${HOME}/.pixi/bin:${PATH}"
        fi
        packages=("${BLD%/}/${SUBDIR}"/*.conda)
        if (( ${#packages[@]} == 0 )); then
          echo "No packages found in ${BLD%/}/${SUBDIR}" >&2
          exit 1
        fi
        pixi exec rattler-build upload prefix --skip-existing "${packages[@]}"
