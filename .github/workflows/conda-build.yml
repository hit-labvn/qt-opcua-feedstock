# This file was generated automatically from conda-smithy. To update this configuration,
# update the conda-forge.yml and/or the recipe/meta.yaml.
# -*- mode: yaml -*-

name: Build conda package
on:
  push:

  pull_request:

  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.CONFIG }}
    environment: prefix-dev
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix:
        include:
          - CONFIG: linux_64_
            STORE_BUILD_ARTIFACTS: False
            UPLOAD_PACKAGES: False
            os: ubuntu
            runs_on: ['ubuntu-latest']
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-x86_64:alma9
          - CONFIG: win_64_
            STORE_BUILD_ARTIFACTS: False
            UPLOAD_PACKAGES: False
            os: windows
            runs_on: ['windows-2022']
    steps:

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build on Linux
      id: build-linux
      if: matrix.os == 'ubuntu'
      env:
        CONFIG: ${{ matrix.CONFIG }}
        UPLOAD_PACKAGES: ${{ matrix.UPLOAD_PACKAGES }}
        DOCKER_IMAGE: ${{ matrix.DOCKER_IMAGE }}
        CI: github_actions
        CONDA_FORGE_DOCKER_RUN_ARGS: "${{ matrix.CONDA_FORGE_DOCKER_RUN_ARGS }}"
        BINSTAR_TOKEN: ${{ secrets.BINSTAR_TOKEN }}
        FEEDSTOCK_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
        STAGING_BINSTAR_TOKEN: ${{ secrets.STAGING_BINSTAR_TOKEN }}
      shell: bash
      run: |
        if [[ "$(uname -m)" == "x86_64" ]]; then
          echo "::group::Configure binfmt_misc"
          docker run --rm --privileged multiarch/qemu-user-static:register --reset --credential yes
        fi
        export flow_run_id="github_$GITHUB_RUN_ID"
        export remote_url="https://github.com/$GITHUB_REPOSITORY"
        export sha="$GITHUB_SHA"
        export FEEDSTOCK_NAME="$(basename $GITHUB_REPOSITORY)"
        export GIT_BRANCH="$(basename $GITHUB_REF)"
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          export IS_PR_BUILD="True"
        else
          export IS_PR_BUILD="False"
        fi
        echo "::endgroup::"
        ./.scripts/run_docker_build.sh

    - name: Build on windows
      id: build-windows
      if: matrix.os == 'windows'
      shell: cmd
      run: |
        set "flow_run_id=github_%GITHUB_RUN_ID%"
        set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
        set "sha=%GITHUB_SHA%"
        call ".scripts\run_win_build.bat"
      env:
        # default value; make it explicit, as it needs to match with artefact
        # generation below. Not configurable for now, can be revisited later
        CONDA_BLD_PATH: C:\bld
        MINIFORGE_HOME: ${{ contains(runner.arch, 'ARM') && 'C' || 'D' }}:\Miniforge
        PYTHONUNBUFFERED: 1
        CONFIG: ${{ matrix.CONFIG }}
        CI: github_actions
        UPLOAD_PACKAGES: ${{ matrix.UPLOAD_PACKAGES }}
        BINSTAR_TOKEN: ${{ secrets.BINSTAR_TOKEN }}
        FEEDSTOCK_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
        STAGING_BINSTAR_TOKEN: ${{ secrets.STAGING_BINSTAR_TOKEN }}

    - name: Upload Linux package to prefix.dev
      if: matrix.os == 'ubuntu' && github.event_name == 'release'
      shell: bash
      env:
        PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        PREFIX_CHANNEL: ${{ secrets.PREFIX_CHANNEL }}
      run: |
        curl -fsSL https://pixi.sh/install.sh | bash
        pixi="$HOME/.pixi/bin/pixi"
        "$pixi" install
        for package in build_artifacts/linux-64/*.conda; do
          # ignore errors because we want to ignore duplicate packages
          "$pixi" run rattler-build upload prefix -c "${PREFIX_CHANNEL}" "${package}" || true
        done

    - name: Upload Windows package to prefix.dev
      if: matrix.os == 'windows' && github.event_name == 'release'
      shell: pwsh
      env:
        PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        PREFIX_CHANNEL: ${{ secrets.PREFIX_CHANNEL }}
      run: |
        $pixi = Join-Path $env:USERPROFILE ".pixi\bin\pixi.exe"
        Get-ChildItem -Path "C:\bld\win-64" -Filter "*.conda" | ForEach-Object {
          # ignore errors because we want to ignore duplicate packages
          & $pixi run rattler-build upload prefix -c "$env:PREFIX_CHANNEL" $_.FullName
        }
        exit 0
